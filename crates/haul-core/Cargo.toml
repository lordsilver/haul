[package]
name = "haul-core"
description = "Download engine, host resolvers and container import for Haul"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
aes = "0.9.3"
base64 = "0.23.1"
bytes = "1.12.1"
cbc = "0.2.1"
ctr = "0.10.1"
dirs = "7.0.0"
iana-time-zone = "0.1.65"
indexmap = { version = "2.14.2", features = ["serde"] }
md-5 = "0.11.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "cookies", "form", "gzip", "json", "query", "rustls", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256", "bzip2", "ppmd", "util"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-socks = "0.5.3"
tokio-util = "0.7.20"
toml = "1.1.6"
toml_edit = "0.25.17"
ts-rs = "12.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
trash = "5.2.9"
unrar_sys = "0.5.8"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
zip = { version = "9.0.5", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "ppmd", "xz", "zstd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[features]
# What the integration tests reach into the engine with; never in a build.
test-hooks = []

# The release suite runs in stand-in mode, one setting for the whole
# process: a test binary of its own, beside the engine's.
[[test]]
name = "releases"
path = "tests/engine/releases.rs"

[dev-dependencies]
# The crate itself with its test hooks, for its own integration tests.
haul-core = { path = ".", features = ["test-hooks"] }
axum = "0.8.9"
futures-util = "0.3.34"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }
