[package]
name = "haul-web"
description = "HTTP API and web UI for Haul, plus the headless `haul` server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "haul"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
haul-core = { version = "0.15.5", path = "../haul-core" }
open = "5.4.4"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12.0.1"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart"] }
tempfile = "3.27.0"
