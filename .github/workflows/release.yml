name: Release

# Pushing a tag like v0.1.0 builds the Windows installers and the headless
# `haul` server, and publishes them as a GitHub release with checksums (and
# build provenance while the repository is public). Running it by hand builds
# the same files as workflow artifacts, without a release; given an existing
# tag, it builds that tag's source with this workflow and replaces the tag's
# release, so older releases can follow the current file names and notes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release again (leave empty for a build without a release)
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag being released; empty for a build without a release.
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  desktop:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Build
        working-directory: crates/haul-desktop
        run: npx --yes @tauri-apps/cli@2.12.2 build --bundles nsis,msi
      - name: Collect
        shell: bash
        env:
          VERSION: ${{ env.TAG || github.sha }}
        # Tauri names the installers after the product, the version and the
        # MSI's language; the release names them like the server archives.
        run: |
          set -euo pipefail
          name="haul-desktop-${VERSION}-x86_64-pc-windows-msvc"
          mkdir dist
          exe=(target/release/bundle/nsis/*-setup.exe)
          msi=(target/release/bundle/msi/*.msi)
          if [ "${#exe[@]}" -ne 1 ] || [ "${#msi[@]}" -ne 1 ]; then
            echo "::error::expected one NSIS and one MSI installer"
            ls -R target/release/bundle
            exit 1
          fi
          cp "${exe[0]}" "dist/$name-setup.exe"
          cp "${msi[0]}" "dist/$name.msi"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installers
          path: dist/*
          if-no-files-found: error

  server:
    name: haul ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build
        run: cargo build --locked --release -p haul-web --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ env.TAG || github.sha }}
        run: |
          set -euo pipefail
          name="haul-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          ext=""
          [[ "$TARGET" == *windows* ]] && ext=".exe"
          cp "target/$TARGET/release/haul$ext" README.md "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -bd "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || inputs.tag
    needs: [desktop, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The full history finds the previous tag for the changelog link.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      # Attestations need a public repository (or GitHub Enterprise).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC: ${{ !github.event.repository.private }}
        # The notes are the tag's message after its first line, without any
        # signature, followed by the downloads and the changelog link. Tags are
        # created with --cleanup=verbatim so Markdown headings survive. The API
        # serves the message even though the checkout keeps no credentials and
        # the repository may be private.
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${ref%% *}" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${ref#* }" --jq .message |
              sed '/^-----BEGIN \(SSH\|PGP\) SIGNATURE-----$/,$d' | sed '1d' | sed '/./,$!d' > changes.md
          else
            : > changes.md
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            if [ -s changes.md ]; then
              cat changes.md
              echo
            fi
            echo "### Downloads"
            echo
            echo "| File | What it is |"
            echo "| --- | --- |"
            echo "| \`haul-desktop-$TAG-x86_64-pc-windows-msvc-setup.exe\` | Windows desktop app, setup program |"
            echo "| \`haul-desktop-$TAG-x86_64-pc-windows-msvc.msi\` | Windows desktop app, MSI package |"
            echo "| \`haul-$TAG-x86_64-pc-windows-msvc.zip\` | Headless server \`haul\` for Windows |"
            echo "| \`haul-$TAG-x86_64-unknown-linux-gnu.tar.gz\` | Headless server \`haul\` for Linux |"
            echo "| \`SHA256SUMS\` | SHA-256 checksums of the files above |"
            echo
            echo "Check a download with \`sha256sum --check --ignore-missing SHA256SUMS\`."
            if [ "$PUBLIC" = true ]; then
              echo "Check where it was built with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            fi
            echo
            if [ -n "$previous" ]; then
              echo "**Full changelog**: $repo/compare/$previous...$TAG"
            else
              echo "**Full changelog**: $repo/commits/$TAG"
            fi
          } > notes.md
          cat notes.md
          if [ ! -s changes.md ]; then
            echo "::warning::tag $TAG has no release notes in its message"
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A rebuild replaces the tag's release and keeps the tag. Only the
        # highest version is marked as the latest release.
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          highest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          latest=false
          [ "$TAG" = "$highest" ] && latest=true
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file notes.md --latest="$latest" --verify-tag
