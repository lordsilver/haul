name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental state is never reused on fresh runners; leaving it out keeps
  # the cached target lean.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      # Mr. Boxington target mode: restores the pruned target tree and Cargo
      # registry, so a change rebuilds only what it touches. Main saves the
      # baseline; each pull request saves its own revisions on top of it.
      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          version: "1.24.0"
          save-on-pull-request: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Check the UI scripts
        if: runner.os == 'Linux'
        run: for f in crates/haul-web/ui/*.js; do node --check "$f"; done
      - name: Clippy
        run: mbx clippy --locked --workspace --all-targets
      - name: Test
        run: mbx test --locked --workspace
